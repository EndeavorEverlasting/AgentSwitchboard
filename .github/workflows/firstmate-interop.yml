name: First Mate interoperability

on:
  push:
    paths:
      - 'tooling/firstmate/**'
      - 'tests/test_firstmate_integration_contract.py'
      - 'docs/harness/firstmate-integration.md'
      - '.github/workflows/firstmate-interop.yml'
  pull_request:
    paths:
      - 'tooling/firstmate/**'
      - 'tests/test_firstmate_integration_contract.py'
      - 'docs/harness/firstmate-integration.md'
      - '.github/workflows/firstmate-interop.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON artifacts
        run: |
          python -m json.tool tooling/firstmate/harness/integration-contract.json >/dev/null
          python -m json.tool tooling/firstmate/harness/upstream-verification.json >/dev/null
      - name: Validate integration contract
        run: python tests/test_firstmate_integration_contract.py
      - name: Validate probe syntax
        run: bash -n tooling/firstmate/Test-FirstMateInterop.sh
