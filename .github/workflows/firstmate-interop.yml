name: First Mate interoperability

on:
  push:
    paths:
      - 'tooling/firstmate/**'
      - 'tests/test_operational_harness.py'
      - 'tests/test_firstmate_integration_contract.py'
      - 'tests/test_firstmate_operational_harness.py'
      - 'tests/test_firstmate_windows_harness_portability.py'
      - 'tests/test_firstmate_windows_wsl_bridge.py'
      - 'docs/harness/firstmate-integration.md'
      - 'docs/harness/firstmate-operational-harness.md'
      - 'docs/reports/firstmate-operational-harness-status.md'
      - '.ai/skills/firstmate-crew-orchestration/**'
      - 'Test-AgentSwitchboard-FirstMate-Harness.sh'
      - 'Test-AgentSwitchboard-FirstMate-Harness.ps1'
      - 'Test-AgentSwitchboard-FirstMate-Harness.cmd'
      - 'Test-AgentSwitchboard-FirstMate-WindowsWSL.ps1'
      - '.github/workflows/firstmate-interop.yml'
  pull_request:
    paths:
      - 'tooling/firstmate/**'
      - 'tests/test_operational_harness.py'
      - 'tests/test_firstmate_integration_contract.py'
      - 'tests/test_firstmate_operational_harness.py'
      - 'tests/test_firstmate_windows_harness_portability.py'
      - 'tests/test_firstmate_windows_wsl_bridge.py'
      - 'docs/harness/firstmate-integration.md'
      - 'docs/harness/firstmate-operational-harness.md'
      - 'docs/reports/firstmate-operational-harness-status.md'
      - '.ai/skills/firstmate-crew-orchestration/**'
      - 'Test-AgentSwitchboard-FirstMate-Harness.sh'
      - 'Test-AgentSwitchboard-FirstMate-Harness.ps1'
      - 'Test-AgentSwitchboard-FirstMate-Harness.cmd'
      - 'Test-AgentSwitchboard-FirstMate-WindowsWSL.ps1'
      - '.github/workflows/firstmate-interop.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON artifacts
        run: |
          python -m json.tool tooling/firstmate/harness/integration-contract.json >/dev/null
          python -m json.tool tooling/firstmate/harness/upstream-verification.json >/dev/null
          for file in tooling/firstmate/harness/operational/*.json tooling/firstmate/harness/operational/workflows/*.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Validate First Mate contracts
        run: |
          python tests/test_firstmate_integration_contract.py
          python tests/test_firstmate_operational_harness.py
          python tests/test_firstmate_windows_harness_portability.py
          python tests/test_firstmate_windows_wsl_bridge.py
      - name: Validate shell surfaces
        run: |
          bash -n Test-AgentSwitchboard-FirstMate-Harness.sh
          bash -n tooling/firstmate/Test-FirstMateInterop.sh
          bash -n tooling/firstmate/harness/operational/hooks/Invoke-FirstMateHarnessPreCommit.sh
          bash -n tooling/firstmate/harness/operational/hooks/Invoke-FirstMateHarnessPrePush.sh
      - name: Generate operator report
        run: |
          python tooling/firstmate/harness/operational/Build-FirstMateHarnessReport.py --output "$RUNNER_TEMP/firstmate-harness-report.md"
          test -s "$RUNNER_TEMP/firstmate-harness-report.md"
          python tooling/firstmate/harness/operational/Build-FirstMateHarnessReport.py --stdout | grep -q 'First Mate operational harness report'
      - name: Validate existing operational harness floor
        run: python tests/test_operational_harness.py
      - name: Validate branch diff hygiene
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD

  windows-native-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows-native First Mate harness
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File .\Test-AgentSwitchboard-FirstMate-Harness.ps1 -Mode contract
      - name: Validate existing operational harness floor
        shell: pwsh
        run: python tests/test_operational_harness.py
      - name: Validate branch diff hygiene
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD
