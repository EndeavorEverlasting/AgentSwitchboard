name: Temporary runtime quiescence contract closeout

on:
  push:
    branches:
      - fix/runtime-quiescence-guard-20260915

permissions:
  contents: write

jobs:
  close-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply quiescence contract closeout repair
        run: python scripts/_tmp_close_quiescence_contract_gaps.py
      - name: Focused prerequisite-gate regression
        run: python -m unittest tests.test_firstmate_windows_wsl_prerequisite_gate -v
      - name: PowerShell parse gate
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './Invoke-Asq017AdminBoxLiveFloor.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Positive quiescence, changed-input escape, and marker contract
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/fm-wsl12-quiescence.json"
          run_gate() {
            local timeout="$1"; local out="$2"
            set +e
            pwsh -NoLogo -NoProfile -File ./Invoke-Asq017AdminBoxLiveFloor.ps1 \
              -SkipGitRefresh -SkipProtectedControl \
              -PrerequisiteTimeoutSeconds "$timeout" \
              -QuiescenceStatePath "$state" >"$out" 2>&1
            local rc=$?
            set -e
            printf '%s' "$rc"
          }
          first_rc="$(run_gate 180 "$RUNNER_TEMP/first.txt")"
          second_rc="$(run_gate 180 "$RUNNER_TEMP/second.txt")"
          third_rc="$(run_gate 181 "$RUNNER_TEMP/third.txt")"
          test "$first_rc" = 46
          test "$second_rc" = 46
          test "$third_rc" = 46
          grep -q '^STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$RUNNER_TEMP/first.txt"
          grep -q '^QUIESCENCE_STATE=recorded$' "$RUNNER_TEMP/first.txt"
          grep -q '^QUIESCENCE_ON_REPEAT=true$' "$RUNNER_TEMP/first.txt"
          grep -q '^STATUS=QUIESCENT_BLOCKED$' "$RUNNER_TEMP/second.txt"
          grep -q '^BLOCKER_STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$RUNNER_TEMP/second.txt"
          grep -q '^PROGRESS_BEARING=false$' "$RUNNER_TEMP/second.txt"
          grep -q '^RETRY_ELIGIBLE=false$' "$RUNNER_TEMP/second.txt"
          if grep -q '^STATUS=QUIESCENT_BLOCKED$' "$RUNNER_TEMP/third.txt"; then exit 1; fi
          grep -q '^STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$RUNNER_TEMP/third.txt"
      - name: Unavailable cache stays fail-open and ineligible
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unwritable-state.txt"
          set +e
          pwsh -NoLogo -NoProfile -File ./Invoke-Asq017AdminBoxLiveFloor.ps1 \
            -SkipGitRefresh -SkipProtectedControl \
            -QuiescenceStatePath /proc/1/asb-quiescence.json >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" = 46
          grep -q '^STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$out"
          grep -q '^QUIESCENCE_STATE=unavailable$' "$out"
          grep -q '^QUIESCENCE_ON_REPEAT=false$' "$out"
          if grep -q '^STATUS=QUIESCENT_BLOCKED$' "$out"; then exit 1; fi
      - name: Existing FirstMate integration contracts
        run: python -m unittest tests.test_firstmate_integration_contract -v
      - name: Remove transport-only closeout files
        run: git rm scripts/_tmp_close_quiescence_contract_gaps.py .github/workflows/tmp-runtime-quiescence-contract-closeout.yml
      - name: Patch hygiene
        run: git diff --check
      - name: Commit durable closeout repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Invoke-Asq017AdminBoxLiveFloor.ps1 tests/test_firstmate_windows_wsl_prerequisite_gate.py docs/harness/firstmate-wsl-physical-floor-runbook.md
          git commit -m 'fix(runtime): close quiescence proof and runbook gaps'
          git push origin HEAD:fix/runtime-quiescence-guard-20260915
