name: Technician pull-and-run contract

on:
  pull_request:
    paths:
      - 'Pull-Repo-And-Setup-AgentSwitchboard.cmd'
      - 'Pull-And-Run-AgentSwitchboard.cmd'
      - 'AgentSwitchboard-Technician-Bootstrap.cmd'
      - 'Technician-AgentSwitchboard-Ready.cmd'
      - 'Validate-Technician-ExactHead.cmd'
      - 'tooling/profiles/windows/Setup-TechnicianAgentSwitchboard.ps1'
      - 'tooling/profiles/windows/Invoke-TechnicianAgentSwitchboardReady.ps1'
      - 'tooling/profiles/windows/Invoke-AgentSwitchboardOpenOrActivate.ps1'
      - 'tooling/profiles/windows/technician-live-cert/stages/P02-Pull-And-Setup.ps1'
      - 'tooling/profiles/windows/technician-live-cert/stages/P03-Verify-Commands.ps1'
      - 'tooling/profiles/windows/technician-live-cert/Install-TechnicianLiveCertShortcuts.ps1'
      - 'scripts/Invoke-TechnicianExactHeadValidation.ps1'
      - 'scripts/Test-TechnicianAgentSwitchboardReady.ps1'
      - 'scripts/Test-WindowsToolchainLaunch.ps1'
      - 'tests/test_technician_pull_and_run_contract.py'
      - 'tests/test_technician_agentswitchboard_ready.py'
      - 'docs/workstation/technician-agentswitchboard-ready.md'
      - '.github/workflows/technician-pull-and-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate portable pull/run and field-failure contract
        run: python tests/test_technician_pull_and_run_contract.py
      - name: Validate real technician AgentSwitchboard readiness contract
        run: python -m unittest tests.test_technician_agentswitchboard_ready
      - name: Prove acquisition Git prerequisite in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/Test-WindowsToolchainLaunch.ps1 -OutputRoot "$env:RUNNER_TEMP\pull-and-run-toolchain-preflight"
      - name: Exercise repository-ready acquisition handoff with real preflight
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set AGENT_SWITCHBOARD_NO_PAUSE=1
          call Pull-And-Run-AgentSwitchboard.cmd --repo-ready acquire "%CD%" "main"
          set CMD_RESULT=%ERRORLEVEL%
          if not "%CMD_RESULT%"=="0" exit /b %CMD_RESULT%
      - name: Parse technician PowerShell surfaces
        shell: pwsh
        run: |
          $paths = @('tooling/profiles/windows/Setup-TechnicianAgentSwitchboard.ps1','tooling/profiles/windows/Invoke-TechnicianAgentSwitchboardReady.ps1','tooling/profiles/windows/Invoke-AgentSwitchboardOpenOrActivate.ps1','tooling/profiles/windows/technician-live-cert/stages/P02-Pull-And-Setup.ps1','tooling/profiles/windows/technician-live-cert/stages/P03-Verify-Commands.ps1','tooling/profiles/windows/technician-live-cert/Install-TechnicianLiveCertShortcuts.ps1','scripts/Invoke-TechnicianExactHeadValidation.ps1','scripts/Test-TechnicianAgentSwitchboardReady.ps1','scripts/Test-WindowsToolchainLaunch.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Validate readiness surface in PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-TechnicianAgentSwitchboardReady.ps1
      - name: Validate readiness surface in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/Test-TechnicianAgentSwitchboardReady.ps1
      - name: Exercise child CMD argument guard
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set AGENT_SWITCHBOARD_NO_PAUSE=1
          call Pull-And-Run-AgentSwitchboard.cmd unsupported-mode
          set CMD_RESULT=%ERRORLEVEL%
          if not "%CMD_RESULT%"=="2" exit /b 1
      - name: Exercise readiness CMD surface without workstation mutation
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set AGENT_SWITCHBOARD_NO_PAUSE=1
          set TECHNICIAN_AGENTSWITCHBOARD_CI_SURFACE=1
          call Technician-AgentSwitchboard-Ready.cmd setup "%CD%" "%GITHUB_HEAD_REF%"
          if errorlevel 1 exit /b 1
      - name: Validate Windows Profile live-certification doctrine
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-WindowsProfileLiveCertification.ps1
      - name: Validate end-to-end runtime skill
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-EndToEndRuntimeValidationSkill.ps1
      - name: Validate agent documentation contract
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-AgentDocumentationContract.ps1
      - name: Validate harness doctrine contract
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-HarnessDoctrineContract.ps1
      - name: Check repository hygiene without a pager
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then BASE_REF=main; fi
          git --no-pager diff --check "origin/$BASE_REF...HEAD"
