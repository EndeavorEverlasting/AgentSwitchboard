name: operator command delivery harness

on:
  pull_request:
    paths:
      - 'tooling/profiles/windows/harness/operator-command-delivery/**'
      - '.ai/skills/operator-command-delivery/**'
      - 'docs/harness/operator-command-delivery.md'
      - 'scripts/Test-OperatorCommandDeliveryHarnessCompleteness.ps1'
      - 'scripts/Test-OperatorChildExecutableLaunch.ps1'
      - 'scripts/Inspect-OperatorTerminalPasteBoundary.ps1'
      - 'tests/test_operator_command_delivery_harness.py'
      - 'tests/test_operator_terminal_paste_boundary.py'
      - '.github/workflows/operator-command-delivery-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate dependency-free harness contract
        run: python -m unittest tests.test_operator_command_delivery_harness tests.test_operator_terminal_paste_boundary
      - name: Validate PowerShell harness completeness
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-OperatorCommandDeliveryHarnessCompleteness.ps1
      - name: Parse tracked PowerShell harness surfaces
        shell: pwsh
        run: |
          $paths = @(
            'scripts/Test-OperatorCommandDeliveryHarnessCompleteness.ps1',
            'scripts/Test-OperatorChildExecutableLaunch.ps1',
            'scripts/Inspect-OperatorTerminalPasteBoundary.ps1',
            'tooling/profiles/windows/harness/operator-command-delivery/hooks/pre-push.ps1',
            'tooling/profiles/windows/harness/operator-command-delivery/fixtures/valid-powershell-command.fixture.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $path"
            }
          }
      - name: Prove terminal paste boundary fixtures
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'terminal-paste-boundary'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $cleanArtifact = Join-Path $out 'clean.json'
          & pwsh -NoLogo -NoProfile -File scripts/Inspect-OperatorTerminalPasteBoundary.ps1 `
            -InputPath tooling/profiles/windows/harness/operator-command-delivery/fixtures/terminal-paste-clean.fixture.txt `
            -OutputPath $cleanArtifact
          if ($LASTEXITCODE -ne 0) { throw "Clean terminal-paste probe failed: $LASTEXITCODE" }
          $clean = Get-Content -LiteralPath $cleanArtifact -Raw | ConvertFrom-Json
          if ($clean.classification -ne 'captured-input-clean-presentation-unproven') { throw "Unexpected clean classification: $($clean.classification)" }
          if ($clean.literalQuestionMarkCount -ne 0 -or $clean.replacementCharacterCount -ne 0) { throw 'Clean fixture unexpectedly contains question/replacement characters.' }
          if ($clean.rawTextPersisted -ne $false -or 'rawText' -in $clean.PSObject.Properties.Name) { throw 'Probe persisted raw captured text.' }

          $questionArtifact = Join-Path $out 'question.json'
          & pwsh -NoLogo -NoProfile -File scripts/Inspect-OperatorTerminalPasteBoundary.ps1 `
            -InputPath tooling/profiles/windows/harness/operator-command-delivery/fixtures/terminal-paste-question-mark.fixture.txt `
            -OutputPath $questionArtifact
          if ($LASTEXITCODE -ne 0) { throw "Question-mark terminal-paste probe failed: $LASTEXITCODE" }
          $question = Get-Content -LiteralPath $questionArtifact -Raw | ConvertFrom-Json
          if ($question.classification -ne 'captured-input-contains-question-mark') { throw "Unexpected question-mark classification: $($question.classification)" }
          if ($question.literalQuestionMarkCount -lt 1) { throw 'Question-mark fixture did not preserve its regression character.' }
          if ($question.rawTextPersisted -ne $false -or 'rawText' -in $question.PSObject.Properties.Name) { throw 'Probe persisted raw captured text.' }
      - name: Prove concrete pwsh child launch
        shell: pwsh
        run: |
          $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
          $out = Join-Path $env:RUNNER_TEMP 'operator-child-launch'
          & pwsh -NoLogo -NoProfile -File scripts/Test-OperatorChildExecutableLaunch.ps1 `
            -ExecutablePath $pwsh `
            -ArgumentList '--version' `
            -Label 'pwsh' `
            -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { throw "Child executable probe failed: $LASTEXITCODE" }
          $artifact = Join-Path $out 'child-executable-launch-result.json'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Missing child launch artifact: $artifact" }
          $result = Get-Content -LiteralPath $artifact -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or $result.proofLevel -ne 'child-executable-launch') { throw "Unexpected child launch result: $($result.status) / $($result.proofLevel)" }
      - name: Exercise opt-in pre-push hook
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tooling/profiles/windows/harness/operator-command-delivery/hooks/pre-push.ps1
      - name: Check repository hygiene without a pager
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then BASE_REF=main; fi
          git --no-pager diff --check "origin/$BASE_REF...HEAD"
