name: Code search indexing harness

on:
  pull_request:
    paths:
      - "CODE_SEARCH.md"
      - "tooling/code-search/**"
      - ".ai/skills/code-search-indexing/**"
      - "scripts/Test-CodeSearchHarnessCompleteness.ps1"
      - "tests/test_code_search_harness.py"
      - "docs/harness/code-search-indexing-harness.md"
      - "docs/reports/code-search-indexing-status.md"
      - ".github/workflows/code-search-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run dependency-free contracts
        run: python tests/test_code_search_harness.py
      - name: Run completeness
        shell: pwsh
        run: ./scripts/Test-CodeSearchHarnessCompleteness.ps1
      - name: Run read-only status
        run: python tooling/code-search/Get-CodeSearchHarnessStatus.py --no-write
      - name: Run documentation contract
        shell: pwsh
        run: ./scripts/Test-AgentDocumentationContract.ps1
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          test -z "$(git status --short)"

  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failures=[System.Collections.Generic.List[string]]::new()
          foreach($path in @('scripts/Test-CodeSearchHarnessCompleteness.ps1','tooling/code-search/hooks/Invoke-CodeSearchHarnessPreCommit.ps1','tooling/code-search/hooks/Invoke-CodeSearchHarnessPrePush.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            foreach($error in @($errors)) { $failures.Add("$path`: $($error.Message)") }
          }
          if($failures.Count){$failures|ForEach-Object{Write-Error $_};exit 1}
      - name: Run dependency-free contracts
        run: python tests/test_code_search_harness.py
      - name: Run completeness
        shell: pwsh
        run: ./scripts/Test-CodeSearchHarnessCompleteness.ps1
      - name: Run read-only status
        run: python tooling/code-search/Get-CodeSearchHarnessStatus.py --no-write
      - name: Run documentation contract
        shell: pwsh
        run: ./scripts/Test-AgentDocumentationContract.ps1
      - name: Verify clean checkout
        shell: pwsh
        run: |
          git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          if(git status --short){throw 'Checkout is dirty after code-search validation.'}
