name: Temporary runtime quiescence fail-open hardening

on:
  push:
    branches:
      - fix/runtime-quiescence-guard-20260915

permissions:
  contents: write

jobs:
  harden-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-open cache hardening
        run: python scripts/_tmp_harden_runtime_quiescence_guard.py
      - name: Focused prerequisite-gate regression
        run: python -m unittest tests.test_firstmate_windows_wsl_prerequisite_gate -v
      - name: PowerShell parse gate
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './Invoke-Asq017AdminBoxLiveFloor.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Quiescence cache failure preserves primary blocker
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unwritable-state.txt"
          set +e
          pwsh -NoLogo -NoProfile -File ./Invoke-Asq017AdminBoxLiveFloor.ps1 \
            -SkipGitRefresh -SkipProtectedControl \
            -QuiescenceStatePath /proc/1/asb-quiescence.json >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" = 46
          grep -q '^STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$out"
          grep -q '^QUIESCENCE_STATE=unavailable$' "$out"
          grep -q '^QUIESCENCE_STATE_OPERATION=write$' "$out"
          if grep -q '^STATUS=QUIESCENT_BLOCKED$' "$out"; then
            echo 'unpersisted state incorrectly claimed quiescence' >&2
            exit 1
          fi
      - name: Existing FirstMate integration contracts
        run: python -m unittest tests.test_firstmate_integration_contract -v
      - name: Remove transport-only hardening
        run: git rm scripts/_tmp_harden_runtime_quiescence_guard.py .github/workflows/tmp-runtime-quiescence-hardening.yml
      - name: Patch hygiene
        run: git diff --check
      - name: Commit durable hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Invoke-Asq017AdminBoxLiveFloor.ps1 tests/test_firstmate_windows_wsl_prerequisite_gate.py
          git commit -m 'fix(runtime): fail open when quiescence cache is unavailable'
          git push origin HEAD:fix/runtime-quiescence-guard-20260915
