name: GNHF tandem thinkers

on:
  pull_request:
    paths:
      - 'tooling/gnhf/Start-AgentSwitchboardTandemThinkers.ps1'
      - 'tooling/gnhf/Start-AgentSwitchboardTandemThinkers.cmd'
      - 'tooling/gnhf/tests/Test-TandemThinkerContracts.ps1'
      - 'tooling/gnhf/TANDEM_THINKERS.md'
      - '.github/workflows/gnhf-tandem-thinkers.yml'
  push:
    branches: [main]
    paths:
      - 'tooling/gnhf/Start-AgentSwitchboardTandemThinkers.ps1'
      - 'tooling/gnhf/Start-AgentSwitchboardTandemThinkers.cmd'
      - 'tooling/gnhf/tests/Test-TandemThinkerContracts.ps1'
      - 'tooling/gnhf/TANDEM_THINKERS.md'
      - '.github/workflows/gnhf-tandem-thinkers.yml'

permissions:
  contents: read

jobs:
  tandem-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Execute tandem concurrency contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoLogo -NoProfile -File tooling/gnhf/tests/Test-TandemThinkerContracts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse tandem PowerShell surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'tooling/gnhf/Start-AgentSwitchboardTandemThinkers.ps1',
            'tooling/gnhf/tests/Test-TandemThinkerContracts.ps1'
          )) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$path parse failure: $($errors.Message -join '; ')" }
          }

      - name: Windows CMD entrypoint contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath tooling/gnhf/Start-AgentSwitchboardTandemThinkers.cmd -Raw
          if (-not $text.Contains('Start-AgentSwitchboardTandemThinkers.ps1')) { throw 'CMD delegate mismatch' }
          if (-not $text.Contains('exit /b %_code%')) { throw 'CMD exit propagation missing' }

      - name: Diff hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'
          } else {
            git diff --check HEAD^ HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git status --short)) { throw 'workflow dirtied checkout' }
