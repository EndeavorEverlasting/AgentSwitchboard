name: Temporary quiescence persistence docs contract

on:
  push:
    branches:
      - fix/runtime-quiescence-guard-20260915
    paths:
      - .github/workflows/tmp-runtime-quiescence-doc-contract.yml

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair persistence-qualified runbook contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runbook_path = Path('docs/harness/firstmate-wsl-physical-floor-runbook.md')
          text = runbook_path.read_text(encoding='utf-8')

          replacements = {
              "if ($childExit -eq 46) {\n  throw 'BLOCKED_WINDOWS_WSL_REQUIRED / QUIESCENT_BLOCKED — move this proof to a Windows Admin Box with runnable wsl.exe+Ubuntu. Do not rerun an unchanged cloud/non-Windows lane; the same proof-relevance fingerprint is quiescent, not new evidence.'\n}":
              "if ($childExit -eq 46) {\n  throw 'BLOCKED_WINDOWS_WSL_REQUIRED — move this proof to a Windows Admin Box with runnable wsl.exe+Ubuntu. If console STATUS=QUIESCENT_BLOCKED, a matching recorded quiescence state suppressed the duplicate child; otherwise this is the first/fail-open blocker observation and a later bounded attempt may still run.'\n}",
              "unavailable Windows/WSL environment (exit 46; ASQ-017 records the first fail-closed observation and an unchanged repeat returns `STATUS=QUIESCENT_BLOCKED` without launching another one-shot)":
              "unavailable Windows/WSL environment (exit 46; when local quiescence persistence succeeds, ASQ-017 records the fail-closed observation and an unchanged repeat with the same stored fingerprint returns `STATUS=QUIESCENT_BLOCKED` without launching another one-shot; unavailable persistence remains fail-open)",
              "On a non-Windows/cloud host, the first exit-46 observation may additionally emit `QUIESCENCE_STATE=recorded` and `QUIESCENCE_ON_REPEAT=true`. A later invocation with the same proof-relevance fingerprint emits `STATUS=QUIESCENT_BLOCKED`, `BLOCKER_STATUS=BLOCKED_WINDOWS_WSL_REQUIRED`, `PROGRESS_BEARING=false`, and `RETRY_ELIGIBLE=false` before another one-shot is launched. That is an intentional stop signal: move the proof to the Admin Box or change a proof-relevant input/environment. Explicit `-EvidenceRoot` and `-FirstMatePath` selectors participate by hashed identity, and WSL command/distribution capability participates through `WSL_ENVIRONMENT_SIGNATURE`; do not create a tip-cite/ledger update merely to make repository HEAD newer.":
              "On a non-Windows/cloud host, an exit-46 observation emits `QUIESCENCE_STATE=recorded` and `QUIESCENCE_ON_REPEAT=true` only when local state persistence succeeds. Only a later invocation with the same known `PROOF_RELEVANCE_FINGERPRINT` stored in that recorded state may emit `STATUS=QUIESCENT_BLOCKED`, `BLOCKER_STATUS=BLOCKED_WINDOWS_WSL_REQUIRED`, `PROGRESS_BEARING=false`, and `RETRY_ELIGIBLE=false` before another one-shot is launched. If persistence instead emits `QUIESCENCE_STATE=unavailable` and `QUIESCENCE_ON_REPEAT=false`, no durable quiescence state exists and the next invocation is allowed to launch another bounded attempt. A recorded identical repeat is the intentional stop signal: move the proof to the Admin Box or change a proof-relevant input/environment. Explicit `-EvidenceRoot` and `-FirstMatePath` selectors participate by hashed identity, and WSL command/distribution capability participates through `WSL_ENVIRONMENT_SIGNATURE`; do not create a tip-cite/ledger update merely to make repository HEAD newer.",
              "ASQ-017 records the first non-Windows blocker in local untracked state; an unchanged second invocation returns `STATUS=QUIESCENT_BLOCKED` without another child proof.":
              "When local quiescence persistence succeeds, ASQ-017 records the blocker in local untracked state; only an unchanged second invocation with the same stored fingerprint returns `STATUS=QUIESCENT_BLOCKED` without another child proof. If persistence is unavailable, the next invocation remains eligible for another bounded attempt."
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected runbook text not found: {old[:120]!r}')
              text = text.replace(old, new, 1)
          runbook_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_firstmate_windows_wsl_prerequisite_gate.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '        self.assertIn("PROGRESS_BEARING=false", self.runbook)\n'
          addition = (
              '        self.assertIn("QUIESCENCE_STATE=recorded", self.runbook)\n'
              '        self.assertIn("QUIESCENCE_STATE=unavailable", self.runbook)\n'
              '        self.assertIn("QUIESCENCE_ON_REPEAT=false", self.runbook)\n'
          )
          if anchor not in test:
              raise SystemExit('focused runbook assertion anchor not found')
          if 'self.assertIn("QUIESCENCE_STATE=unavailable", self.runbook)' not in test:
              test = test.replace(anchor, anchor + addition, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Focused prerequisite-gate regression
        run: python -m unittest tests.test_firstmate_windows_wsl_prerequisite_gate -v
      - name: Existing FirstMate integration contracts
        run: python -m unittest tests.test_firstmate_integration_contract -v
      - name: Patch hygiene
        run: git diff --check
      - name: Remove transport workflow and commit durable repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-runtime-quiescence-doc-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/harness/firstmate-wsl-physical-floor-runbook.md tests/test_firstmate_windows_wsl_prerequisite_gate.py
          git commit -m 'docs(runtime): qualify quiescence on persisted state'
          git push origin HEAD:fix/runtime-quiescence-guard-20260915
