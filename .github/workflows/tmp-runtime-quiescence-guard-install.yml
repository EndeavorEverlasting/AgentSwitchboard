name: Temporary runtime quiescence guard installer

on:
  push:
    branches:
      - fix/runtime-quiescence-guard-20260915

permissions:
  contents: write

jobs:
  install-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded quiescence guard
        run: python scripts/_tmp_install_runtime_quiescence_guard.py
      - name: Focused prerequisite-gate regression
        run: python -m unittest tests.test_firstmate_windows_wsl_prerequisite_gate -v
      - name: PowerShell parse gate
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './Invoke-Asq017AdminBoxLiveFloor.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Live fail-closed quiescence behavior on non-Windows runner
        shell: bash
        run: |
          set -u
          state="$RUNNER_TEMP/fm-wsl12-quiescence.json"
          run_gate() {
            local timeout="$1"
            local out="$2"
            set +e
            pwsh -NoLogo -NoProfile -File ./Invoke-Asq017AdminBoxLiveFloor.ps1 \
              -SkipGitRefresh -SkipProtectedControl \
              -PrerequisiteTimeoutSeconds "$timeout" \
              -QuiescenceStatePath "$state" >"$out" 2>&1
            local rc=$?
            set -e
            printf '%s' "$rc"
          }
          set -e
          first_rc="$(run_gate 180 "$RUNNER_TEMP/first.txt")"
          second_rc="$(run_gate 180 "$RUNNER_TEMP/second.txt")"
          third_rc="$(run_gate 181 "$RUNNER_TEMP/third.txt")"
          test "$first_rc" = 46
          test "$second_rc" = 46
          test "$third_rc" = 46
          grep -q '^STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$RUNNER_TEMP/first.txt"
          grep -q '^QUIESCENCE_ON_REPEAT=true$' "$RUNNER_TEMP/first.txt"
          grep -q '^STATUS=QUIESCENT_BLOCKED$' "$RUNNER_TEMP/second.txt"
          grep -q '^BLOCKER_STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$RUNNER_TEMP/second.txt"
          grep -q '^PROGRESS_BEARING=false$' "$RUNNER_TEMP/second.txt"
          grep -q '^RETRY_ELIGIBLE=false$' "$RUNNER_TEMP/second.txt"
          grep -q '^QUIESCENCE_REASON=REPEATED_UNCHANGED_EXTERNAL_BLOCKER$' "$RUNNER_TEMP/second.txt"
          if grep -q '^STATUS=QUIESCENT_BLOCKED$' "$RUNNER_TEMP/third.txt"; then
            echo 'changed proof-relevant timeout was incorrectly quiesced' >&2
            exit 1
          fi
          grep -q '^STATUS=BLOCKED_WINDOWS_WSL_REQUIRED$' "$RUNNER_TEMP/third.txt"
      - name: Existing FirstMate integration contracts
        run: python -m unittest tests.test_firstmate_integration_contract -v
      - name: Remove transport-only installer
        run: git rm scripts/_tmp_install_runtime_quiescence_guard.py .github/workflows/tmp-runtime-quiescence-guard-install.yml
      - name: Patch hygiene
        run: git diff --check
      - name: Commit durable runtime guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Invoke-Asq017AdminBoxLiveFloor.ps1 tests/test_firstmate_windows_wsl_prerequisite_gate.py
          git commit -m 'fix(runtime): quiesce repeated unchanged external blockers'
          git push origin HEAD:fix/runtime-quiescence-guard-20260915
