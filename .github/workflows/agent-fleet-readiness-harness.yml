name: agent fleet readiness harness

on:
  pull_request:
    paths:
      - 'tooling/profiles/windows/harness/agent-fleet-readiness/**'
      - '.ai/skills/agent-fleet-readiness/**'
      - 'docs/harness/agent-fleet-readiness.md'
      - 'scripts/Test-AgentFleetReadinessHarnessCompleteness.ps1'
      - 'tests/test_agent_fleet_readiness_harness.py'
      - '.github/workflows/agent-fleet-readiness-harness.yml'
  workflow_dispatch:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependency-free readiness harness contract
        shell: pwsh
        run: python -m unittest tests.test_agent_fleet_readiness_harness

      - name: Readiness harness completeness
        shell: pwsh
        run: ./scripts/Test-AgentFleetReadinessHarnessCompleteness.ps1

      - name: Existing GNHF fleet contracts
        shell: pwsh
        run: ./tooling/gnhf/Test-GnhfFleetContracts.ps1

      - name: Parse tracked PowerShell harness surfaces
        shell: pwsh
        run: |
          $paths = @(
            'scripts/Test-AgentFleetReadinessHarnessCompleteness.ps1',
            'tooling/profiles/windows/harness/agent-fleet-readiness/hooks/pre-push.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Opt-in pre-push hook
        shell: pwsh
        run: ./tooling/profiles/windows/harness/agent-fleet-readiness/hooks/pre-push.ps1

      - name: Diff hygiene
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin $env:BASE_REF --depth=1
          git --no-pager diff --check "origin/$env:BASE_REF...HEAD"
