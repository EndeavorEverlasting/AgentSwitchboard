name: Machine Profile Harness Completeness

on:
  pull_request:
    paths:
      - 'tooling/profiles/windows/harness/machine-profile/**'
      - 'tooling/profiles/windows/Get-MachineProfileHarnessStatus.ps1'
      - 'tooling/profiles/windows/hooks/Invoke-MachineProfileHarnessPreCommit.ps1'
      - 'scripts/Test-MachineProfileHarnessCompleteness.ps1'
      - 'tests/test_machine_profile_harness_completeness.py'
      - '.ai/skills/machine-profile-bootstrap/SKILL.md'
      - 'docs/workstation/machine-profile-bootstrap.md'
      - 'Get-MachineProfileHarnessStatus.cmd'
      - 'Test-MachineProfileHarness.cmd'
      - '.github/workflows/machine-profile-harness-completeness.yml'
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Python harness contracts
        run: python -m unittest tests.test_machine_profile_harness_completeness
      - name: PowerShell harness completeness
        shell: pwsh
        run: ./scripts/Test-MachineProfileHarnessCompleteness.ps1
      - name: Existing Python machine-profile contracts
        run: python -m unittest tests.test_machine_profile_bootstrap
      - name: Existing PowerShell machine-profile validator
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/Test-MachineProfileBootstrap.ps1
      - name: Diff hygiene
        shell: bash
        run: git diff --check
