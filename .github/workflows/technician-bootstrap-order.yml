name: Technician bootstrap order

on:
  push:
    paths:
      - 'Technician-AgentSwitchboard-Ready.cmd'
      - 'tooling/profiles/windows/Invoke-TechnicianBootstrapPrerequisites.ps1'
      - 'tooling/profiles/windows/Invoke-TechnicianAgentSwitchboardReady.ps1'
      - 'tooling/profiles/windows/harness/technician-ready/**'
      - 'scripts/Test-TechnicianBootstrapOrder.ps1'
      - 'Test-TechnicianBootstrapOrder.cmd'
      - 'tests/test_technician_bootstrap_order.py'
      - 'docs/harness/technician-bootstrap-order.md'
      - '.github/workflows/technician-bootstrap-order.yml'
  pull_request:
    paths:
      - 'Technician-AgentSwitchboard-Ready.cmd'
      - 'tooling/profiles/windows/Invoke-TechnicianBootstrapPrerequisites.ps1'
      - 'tooling/profiles/windows/Invoke-TechnicianAgentSwitchboardReady.ps1'
      - 'tooling/profiles/windows/harness/technician-ready/**'
      - 'scripts/Test-TechnicianBootstrapOrder.ps1'
      - 'Test-TechnicianBootstrapOrder.cmd'
      - 'tests/test_technician_bootstrap_order.py'
      - 'docs/harness/technician-bootstrap-order.md'
      - '.github/workflows/technician-bootstrap-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Python order contracts
        run: python -m unittest tests.test_technician_bootstrap_order -v

      - name: PowerShell order validator
        shell: pwsh
        run: ./scripts/Test-TechnicianBootstrapOrder.ps1 -RootPath .

      - name: Existing technician readiness contracts
        run: python -m unittest tests.test_technician_agentswitchboard_ready -v

      - name: Diff whitespace
        shell: bash
        run: git diff --check
