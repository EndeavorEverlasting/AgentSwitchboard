name: Technician Live-Cert Surface CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'tooling/profiles/windows/technician-live-cert/**'
      - 'tooling/profiles/windows/harness/technician-live-cert/**'
      - 'tooling/profiles/windows/Get-TechnicianLiveCertHarnessStatus.ps1'
      - 'tooling/profiles/windows/hooks/Invoke-TechnicianLiveCertPreCommit.ps1'
      - 'Technician-LiveCert-*.cmd'
      - 'Repair-Technician-*.cmd'
      - 'Run-Technician-LiveCert.cmd'
      - 'AgentSwitchboard-Technician-Bootstrap.cmd'
      - 'Open-TechnicianLiveCertEvidence.cmd'
      - 'Install-TechnicianLiveCertShortcuts.cmd'
      - 'scripts/Test-OperatorCommandEnvelope.ps1'
      - 'scripts/Test-TechnicianLiveCertSurface.ps1'
      - 'scripts/Test-TechnicianLiveCertHarness.ps1'
      - 'scripts/Test-WindowsProfileLiveCertification.ps1'
      - 'tests/test_operator_command_envelope.py'
      - 'tests/test_technician_live_cert_surface.py'
      - 'tests/test_technician_live_cert_harness.py'
      - '.ai/skills/operator-command-envelope/SKILL.md'
      - '.ai/skills/windows-profile-live-certification/SKILL.md'
      - '.github/workflows/technician-live-cert-surface.yml'
      - 'docs/workstation/technician-live-cert-click-guide.md'
      - 'docs/workstation/technician-agentswitchboard-ready.md'
      - 'docs/harness/technician-live-cert-harness.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-surface:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Python operator-command envelope tests
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'operator-command-python.log'
          $output = @(& python -m unittest tests.test_operator_command_envelope 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { [string]$_ } | Tee-Object -FilePath $logPath
          if ($exitCode -ne 0) {
            $message = (($output | ForEach-Object { [string]$_ }) -join "`n")
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Operator command envelope Python failure::$message"
            exit $exitCode
          }

      - name: Run Python live-cert surface tests
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'technician-surface-python.log'
          $output = @(& python -m unittest tests.test_technician_live_cert_surface 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { [string]$_ } | Tee-Object -FilePath $logPath
          if ($exitCode -ne 0) {
            $message = (($output | ForEach-Object { [string]$_ }) -join "`n")
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Technician live-cert surface Python failure::$message"
            exit $exitCode
          }

      - name: Run Python live-cert harness tests
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'technician-harness-python.log'
          $output = @(& python -m unittest tests.test_technician_live_cert_harness 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { [string]$_ } | Tee-Object -FilePath $logPath
          if ($exitCode -ne 0) {
            $message = (($output | ForEach-Object { [string]$_ }) -join "`n")
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Technician live-cert harness Python failure::$message"
            exit $exitCode
          }

      - name: Validate operator commands in PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-OperatorCommandEnvelope.ps1 -OutputRoot operator-command-envelope-report/pwsh

      - name: Validate surface in PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-TechnicianLiveCertSurface.ps1

      - name: Validate harness in PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-TechnicianLiveCertHarness.ps1

      - name: Validate operator commands in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/Test-OperatorCommandEnvelope.ps1 -OutputRoot operator-command-envelope-report/windows-powershell

      - name: Validate surface in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/Test-TechnicianLiveCertSurface.ps1

      - name: Validate harness in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/Test-TechnicianLiveCertHarness.ps1

      - name: Validate Windows Profile live-certification doctrine
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-WindowsProfileLiveCertification.ps1

      - name: Validate end-to-end runtime skill
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-EndToEndRuntimeValidationSkill.ps1

      - name: Validate device profile launcher contract
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/Test-DeviceProfileLauncherContract.ps1

      - name: Exercise CMD dry-run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AGENT_SWITCHBOARD_NO_PAUSE = '1'
          $env:TECHNICIAN_LIVE_CERT_CI_SURFACE = '1'
          $logPath = Join-Path $PWD 'technician-p00-ci.log'
          & cmd.exe /d /c "call Technician-LiveCert-P00-Preflight.cmd > `"$logPath`" 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content -LiteralPath $logPath
          if ($exitCode -ne 0) {
            throw "Technician-LiveCert-P00-Preflight.cmd failed with exit code $exitCode. See technician-p00-ci evidence artifact."
          }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technician-live-cert-validation-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            operator-command-python.log
            operator-command-envelope-report/**
            technician-surface-python.log
            technician-harness-python.log
            technician-p00-ci.log
          if-no-files-found: warn
          retention-days: 7

      - name: Check repository hygiene without a pager
        shell: bash
        run: git --no-pager diff --check
