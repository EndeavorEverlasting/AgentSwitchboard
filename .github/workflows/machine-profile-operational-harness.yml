name: Machine profile operational harness

on:
  pull_request:
    paths:
      - 'tooling/profiles/windows/harness/machine-profile/**'
      - 'tooling/profiles/windows/Get-MachineProfileOperationalStatus.ps1'
      - 'tooling/profiles/windows/Get-PersonalWorkstationBootstrapStatus.ps1'
      - 'tooling/profiles/windows/Invoke-PersonalEssentialApps.ps1'
      - 'tooling/profiles/windows/Invoke-PersonalWorkstationProvision.ps1'
      - 'tests/test_personal_workstation_bootstrap_contract.py'
      - 'docs/workstation/personal-development-workstation.md'
      - 'tooling/profiles/windows/Get-PersonalWorkstationBootstrapStatus.ps1'
      - 'tooling/profiles/windows/Invoke-PersonalEssentialApps.ps1'
      - 'tooling/profiles/windows/Invoke-PersonalWorkstationProvision.ps1'
      - 'tests/test_personal_workstation_bootstrap_contract.py'
      - 'docs/workstation/personal-development-workstation.md'
      - 'scripts/Test-MachineProfileOperationalHarness.ps1'
      - 'tests/test_machine_profile_operational_harness.py'
      - 'docs/workstation/machine-profile-bootstrap.md'
      - '.github/workflows/machine-profile-operational-harness.yml'
  push:
    branches: [main]
    paths:
      - 'tooling/profiles/windows/harness/machine-profile/**'
      - 'tooling/profiles/windows/Get-MachineProfileOperationalStatus.ps1'
      - 'scripts/Test-MachineProfileOperationalHarness.ps1'
      - 'tests/test_machine_profile_operational_harness.py'
      - 'docs/workstation/machine-profile-bootstrap.md'
      - '.github/workflows/machine-profile-operational-harness.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable operational contract
        run: python tests/test_machine_profile_operational_harness.py
      - name: Personal workstation bootstrap contract
        run: python tests/test_personal_workstation_bootstrap_contract.py
      - name: Windows essential apps non-mutating inspect smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'asb-essential-apps-test'
          ./tooling/profiles/windows/Invoke-PersonalEssentialApps.ps1 -Mode Inspect -OutputRoot $output
          $receipts = @(Get-ChildItem -LiteralPath $output -Filter essential-apps-summary.json -Recurse -File)
          if ($receipts.Count -ne 1) { throw 'Expected one essential app inspection receipt.' }
          $receipt = Get-Content -LiteralPath $receipts[0].FullName -Raw | ConvertFrom-Json
          if ($receipt.mode -ne 'Inspect' -or $receipt.state -ne 'inspection-complete') { throw 'Inspect mode did not return inspection-complete.' }
          $ids = @($receipt.apps | ForEach-Object { $_.id })
          if (@(Compare-Object @('brave','wispr-flow') $ids).Count -ne 0) { throw 'Essential app identities drifted.' }
      - name: Windows personal workstation inspect-only smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'asb-personal-bootstrap-contract-smoke'
          ./tooling/profiles/windows/Get-PersonalWorkstationBootstrapStatus.ps1 -EnvironmentRoleId desktop-workstation -OutputRoot $out
          $reports = @(Get-ChildItem -Path $out -Filter status.json -Recurse -File)
          if ($reports.Count -ne 1) { throw 'Expected one personal-workstation inspection receipt' }
          $result = Get-Content -Raw $reports[0].FullName | ConvertFrom-Json
          if ($result.mode -ne 'inspect-only' -or $result.environmentRoleId -ne 'desktop-workstation') { throw 'Inspection receipt mismatched its role/mode' }
      - name: Windows full-profile orchestration inspect-only smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'asb-full-profile-inspect'
          ./tooling/profiles/windows/Invoke-PersonalWorkstationProvision.ps1 -EnvironmentRoleId desktop-workstation -Profile engineering-full -Mode Inspect -OutputRoot $out
          $reports = @(Get-ChildItem -Path $out -Filter provision-summary.json -Recurse -File)
          if ($reports.Count -ne 1) { throw 'Expected exactly one provision-summary inspection receipt' }
          $state = Get-Content -Raw $reports[0].FullName | ConvertFrom-Json
          if ($state.state -ne 'inspected-only' -or $state.profile -ne 'engineering-full') { throw 'Incorrect full-profile inspection classification' }
          $invalidOutput = Join-Path $env:RUNNER_TEMP 'asb-full-profile-invalid-role'
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'tooling/profiles/windows/Invoke-PersonalWorkstationProvision.ps1'
          $err = Join-Path $env:RUNNER_TEMP 'asb-invalid-role-stderr.txt'
          $args = @('-NoProfile','-File',$scriptPath,'-EnvironmentRoleId','admin-box-1','-Profile','engineering-full','-Mode','Apply','-OutputRoot',$invalidOutput)
          $bad = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $args -NoNewWindow -Wait -PassThru -RedirectStandardError $err
          if ($bad.ExitCode -eq 0) { throw 'Managed Admin Box role incorrectly accepted' }
          if (Test-Path $invalidOutput) { throw 'Invalid role unexpectedly created provisioning state' }
      - name: PowerShell operational contract
        shell: pwsh
        run: ./scripts/Test-MachineProfileOperationalHarness.ps1
      - name: Current machine-profile Python contract
        run: python -m unittest tests.test_machine_profile_bootstrap
      - name: Current machine-profile Windows contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-MachineProfileBootstrap.ps1
      - name: Agent documentation contract
        shell: pwsh
        run: ./scripts/Test-AgentDocumentationContract.ps1
      - name: Diff hygiene and clean checkout
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          } else {
            git diff --check HEAD^
          }
          if (git status --short) { throw 'Checkout is dirty after machine-profile operational validation.' }
