name: Machine profile operational harness

on:
  pull_request:
    paths:
      - 'tooling/profiles/windows/harness/machine-profile/**'
      - 'tooling/profiles/windows/Get-MachineProfileOperationalStatus.ps1'
      - 'tooling/profiles/windows/Get-PersonalWorkstationBootstrapStatus.ps1'
      - 'tests/test_personal_workstation_bootstrap_contract.py'
      - 'docs/workstation/personal-development-workstation.md'
      - 'tooling/profiles/windows/Get-PersonalWorkstationBootstrapStatus.ps1'
      - 'tests/test_personal_workstation_bootstrap_contract.py'
      - 'docs/workstation/personal-development-workstation.md'
      - 'scripts/Test-MachineProfileOperationalHarness.ps1'
      - 'tests/test_machine_profile_operational_harness.py'
      - 'docs/workstation/machine-profile-bootstrap.md'
      - '.github/workflows/machine-profile-operational-harness.yml'
  push:
    branches: [main]
    paths:
      - 'tooling/profiles/windows/harness/machine-profile/**'
      - 'tooling/profiles/windows/Get-MachineProfileOperationalStatus.ps1'
      - 'scripts/Test-MachineProfileOperationalHarness.ps1'
      - 'tests/test_machine_profile_operational_harness.py'
      - 'docs/workstation/machine-profile-bootstrap.md'
      - '.github/workflows/machine-profile-operational-harness.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable operational contract
        run: python tests/test_machine_profile_operational_harness.py
      - name: Personal workstation bootstrap contract
        run: python tests/test_personal_workstation_bootstrap_contract.py
      - name: Windows personal workstation inspect-only smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'asb-personal-bootstrap-contract-smoke'
          ./tooling/profiles/windows/Get-PersonalWorkstationBootstrapStatus.ps1 -EnvironmentRoleId desktop-workstation -OutputRoot $out
          $reports = @(Get-ChildItem -Path $out -Filter status.json -Recurse -File)
          if ($reports.Count -ne 1) { throw 'Expected one personal-workstation inspection receipt' }
          $result = Get-Content -Raw $reports[0].FullName | ConvertFrom-Json
          if ($result.mode -ne 'inspect-only' -or $result.environmentRoleId -ne 'desktop-workstation') { throw 'Inspection receipt mismatched its role/mode' }
      - name: PowerShell operational contract
        shell: pwsh
        run: ./scripts/Test-MachineProfileOperationalHarness.ps1
      - name: Current machine-profile Python contract
        run: python -m unittest tests.test_machine_profile_bootstrap
      - name: Current machine-profile Windows contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-MachineProfileBootstrap.ps1
      - name: Agent documentation contract
        shell: pwsh
        run: ./scripts/Test-AgentDocumentationContract.ps1
      - name: Diff hygiene and clean checkout
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          } else {
            git diff --check HEAD^
          }
          if (git status --short) { throw 'Checkout is dirty after machine-profile operational validation.' }
