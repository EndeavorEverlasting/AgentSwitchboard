name: Automated test floor

on:
  pull_request:
  # Quota-aware: feature-branch pushes are covered by pull_request.
  # Avoid double-spend when monthly GitHub Actions minutes are exhausted.
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: automated-test-floor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Record candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            candidate_sha="${{ github.event.pull_request.head.sha }}"
          else
            candidate_sha="$(git rev-parse HEAD)"
          fi
          echo "candidateSha=${candidate_sha}"
          echo "github.sha=${GITHUB_SHA}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "CANDIDATE_SHA=${candidate_sha}" >> "$GITHUB_ENV"

      - name: Parse floor runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Test-AutomatedTestFloor.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Meta contracts for the floor
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_automated_test_floor -v

      - name: Run canonical automated test floor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'automated-test-floor'
          & pwsh -NoLogo -NoProfile -File .\scripts\Test-AutomatedTestFloor.ps1 -OutputRoot $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content -LiteralPath (Join-Path $output 'automated-test-floor-receipt.json') -Raw | ConvertFrom-Json
          $expected = if ($env:CANDIDATE_SHA) { $env:CANDIDATE_SHA } else { [string]$receipt.candidateSha }
          Write-Host ("receipt.result={0} receipt.candidateSha={1} expectedHead={2} requiredPass={3}" -f $receipt.result, $receipt.candidateSha, $expected, $receipt.summary.requiredPass)
          if ($receipt.result -ne 'PASS') { throw 'floor receipt is not PASS' }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.candidateSha) -or [string]$receipt.candidateSha -eq 'UNKNOWN') {
            throw 'floor receipt missing candidateSha'
          }
          if ([int]$receipt.summary.requiredPass -lt 1) { throw 'FAIL-CLOSED: receipt reports zero required passes' }
          # On pull_request, actions/checkout defaults to a merge commit; require the PR head to be an ancestor of the observed checkout.
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            & git merge-base --is-ancestor $expected HEAD
            if ($LASTEXITCODE -ne 0) { throw "expected PR head $expected is not an ancestor of checkout HEAD" }
            Write-Host ("PR_HEAD_CONTAINED expectedHead={0} checkoutHead={1}" -f $expected, (git rev-parse HEAD))
          }

      - name: Upload floor receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-floor-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/automated-test-floor/*
          if-no-files-found: warn
          retention-days: 14

      - name: Diff hygiene and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            fi
          fi
          test -z "$(git status --short)"
