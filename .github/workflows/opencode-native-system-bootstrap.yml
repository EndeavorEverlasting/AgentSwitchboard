name: OpenCode native system bootstrap

on:
  push:
    paths:
      - 'tooling/profiles/windows/Install-AgentSwitchboardOpenCode.ps1'
      - 'tooling/profiles/windows/Setup-TechnicianAgentSwitchboard.ps1'
      - 'Pull-And-Run-AgentSwitchboard.cmd'
      - 'Bootstrap-OpenCode-SystemWide.cmd'
      - 'Unbootstrap-OpenCode-SystemWide.cmd'
      - 'tooling/harness/system-bootstrap-lifecycle/**'
      - 'tooling/harness/operational/opencode-lsp-setup/native-system-bootstrap.contract.json'
      - 'scripts/Test-SystemBootstrapLifecycleContracts.ps1'
      - 'scripts/Test-OpenCodeNativeSystemBootstrap.ps1'
      - 'tests/test_system_bootstrap_lifecycle.py'
      - 'tests/test_opencode_native_system_bootstrap.py'
      - 'docs/harness/system-bootstrap-lifecycle.md'
      - 'docs/harness/opencode-native-system-bootstrap.md'
      - '.github/workflows/opencode-native-system-bootstrap.yml'
  pull_request:
    paths:
      - 'tooling/profiles/windows/Install-AgentSwitchboardOpenCode.ps1'
      - 'tooling/profiles/windows/Setup-TechnicianAgentSwitchboard.ps1'
      - 'Pull-And-Run-AgentSwitchboard.cmd'
      - 'Bootstrap-OpenCode-SystemWide.cmd'
      - 'Unbootstrap-OpenCode-SystemWide.cmd'
      - 'tooling/harness/system-bootstrap-lifecycle/**'
      - 'tooling/harness/operational/opencode-lsp-setup/native-system-bootstrap.contract.json'
      - 'scripts/Test-SystemBootstrapLifecycleContracts.ps1'
      - 'scripts/Test-OpenCodeNativeSystemBootstrap.ps1'
      - 'tests/test_system_bootstrap_lifecycle.py'
      - 'tests/test_opencode_native_system_bootstrap.py'
      - 'docs/harness/system-bootstrap-lifecycle.md'
      - 'docs/harness/opencode-native-system-bootstrap.md'
      - '.github/workflows/opencode-native-system-bootstrap.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency-free bootstrap contracts
        run: python -m unittest tests.test_system_bootstrap_lifecycle tests.test_opencode_native_system_bootstrap -v
      - name: Shared lifecycle validation
        shell: pwsh
        run: ./scripts/Test-SystemBootstrapLifecycleContracts.ps1 -RootPath .
      - name: Whole-script PowerShell and focused harness validation
        shell: pwsh
        run: ./scripts/Test-OpenCodeNativeSystemBootstrap.ps1 -RootPath .
      - name: Existing OpenCode LSP harness contract
        run: python -m unittest tests.test_opencode_lsp_harness -v
      - name: Agent documentation contract
        shell: pwsh
        run: ./scripts/Test-AgentDocumentationContract.ps1
      - name: Diff whitespace
        shell: bash
        run: git diff --check
